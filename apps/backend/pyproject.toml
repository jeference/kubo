[project]
name = "kubo-backend"
version = "0.1.0"
description = "Kubo: backend (API, webhooks, worker de geração e tarefas agendadas)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "Pillow>=10.0",
    "structlog>=24.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "gunicorn>=23.0",
    # Estimativa de volume das malhas (creations/costing.py).
    "trimesh>=4.4",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory_boy>=3.3",
    "freezegun>=1.4",
    "responses>=0.25",
    "ruff>=0.6",
    # Postgres local sem Docker (scripts/dev_db.py).
    "pgserver>=0.1.4",
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "common*", "audit*", "accounts*", "catalog*", "media*", "creations*", "orders*", "shipping*", "payments*", "fulfillment*", "notifications*", "analytics*", "integrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["B904"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = "test_*.py"
addopts = "--reuse-db --strict-markers -q"
filterwarnings = ["ignore::DeprecationWarning"]
