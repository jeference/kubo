{% extends "emails/base.html" %}
{% block content %}
<p>O pedido <strong>{{ number }}</strong> mudou de status: <strong>{{ status_label }}</strong>.</p>
{% if tracking_code %}<p>Código de rastreio: <strong>{{ tracking_code }}</strong></p>{% endif %}
<p style="margin:24px 0"><a href="{{ tracking_url }}" style="background:#faff00;color:#7c3aed;border:1px solid #7c3aed;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:bold">Acompanhar pedido</a></p>
{% endblock %}
