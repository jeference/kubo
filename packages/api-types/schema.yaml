components:
  schemas:
    AccessRefresh:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
    AccountDeleteRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        street:
          type: string
          readOnly: true
        number:
          type: string
          readOnly: true
        complement:
          type: string
          readOnly: true
        neighborhood:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
      required:
      - city
      - complement
      - id
      - neighborhood
      - number
      - postal_code
      - state
      - street
    AddressLookup:
      type: object
      properties:
        postal_code:
          type: string
        street:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
      required:
      - city
      - neighborhood
      - postal_code
      - state
      - street
    ApplyVersionRequest:
      type: object
      properties:
        version_id:
          type: string
          format: uuid
      required:
      - version_id
    AuthSessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - tokens
      - user
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal_cents:
          type: integer
        item_count:
          type: integer
      required:
      - item_count
      - items
      - subtotal_cents
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        creation_id:
          type: string
          format: uuid
          readOnly: true
        size_id:
          type: string
          format: uuid
          readOnly: true
        size_label:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        unit_price_cents:
          type: integer
          readOnly: true
        line_total_cents:
          type: integer
          readOnly: true
        image_url:
          type: string
          readOnly: true
        unavailable_reason:
          type: string
          readOnly: true
      required:
      - creation_id
      - id
      - image_url
      - line_total_cents
      - quantity
      - size_id
      - size_label
      - unavailable_reason
      - unit_price_cents
    CartItemCreateRequest:
      type: object
      properties:
        creation_id:
          type: string
          format: uuid
        size_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 10
          minimum: 1
      required:
      - creation_id
      - quantity
      - size_id
    Charge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChargeStatusEnum'
          readOnly: true
        amount_cents:
          type: integer
          readOnly: true
        pix_br_code:
          type: string
          readOnly: true
        pix_qr_base64:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        paid_at:
          type: string
