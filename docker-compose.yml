# Produção em uma VPS. Banco gerenciado e storage S3 ficam fora daqui: use `DATABASE_URL` e AWS_*.
# Migrações: docker compose run --rm web python manage.py migrate
services:
  web:
    build: ./apps/backend
    env_file: ./apps/backend/.env
    restart: unless-stopped
    ports: ["8000:8000"]

  worker:
    build: ./apps/backend
    env_file: ./apps/backend/.env
    command: python manage.py run_generation_worker
    restart: unless-stopped
    stop_grace_period: 2m

  scheduler:
    build: ./apps/backend
    env_file: ./apps/backend/.env
    command: python manage.py run_scheduler
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: apps/web/consumer/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://web:8000
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    restart: unless-stopped
    ports: ["3000:3000"]
